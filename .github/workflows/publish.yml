# Uploads ShapeRunner to PyPI, so `pip install shaperunner` gets it.
# Runs only by hand: Actions tab -> Publish to PyPI -> Run workflow, and pick
# testpypi (a practice copy of PyPI) or pypi. The version is APP_VERSION in
# the current shapes_v*.py; PyPI never accepts the same version twice.
#
# No password or token is stored here. PyPI trusts this workflow file
# ("trusted publishing"), set up once on pypi.org and test.pypi.org under
# Account settings -> Publishing: owner wolfybird, repository shaperunner,
# workflow publish.yml, environment pypi (or testpypi).
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      # PortAudio is installed but this runner has no sound server, so it
      # can't start: the self-test must report exactly that (exit code 3)
      # and keep going. Audio missing altogether (2) or a crash (1) fails
      # the run, and so does audio working (0), which would mean this test
      # no longer covers the can't-start case.
      - name: Install it and self-test
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
          python -m pip install dist/*.whl
          shaperunner --version
          code=0
          shaperunner --selftest || code=$?
          if [ "$code" -ne 3 ]; then
            echo "::error::expected self-test exit code 3 (PortAudio can't start), got $code"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write          # lets PyPI confirm the upload comes from here
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/

      - name: Upload to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Upload to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
