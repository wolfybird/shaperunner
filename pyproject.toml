# pip packaging. The wheel installs the current shapes_v*.py as the module
# "shaperunner", with a "shaperunner" command. When a newer version ships,
# change the file name in the three places marked CURRENT.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shaperunner"
dynamic = ["version"]
description = "Rotating 3D wireframes drawn as ASCII art, in their own window or in the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "RFrank" }]
keywords = ["ascii", "ascii-art", "3d", "wireframe", "terminal", "visualizer", "audio-reactive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy",
    "pygame-ce",      # the window (has wheels for new Pythons; imports as pygame)
    "sounddevice",    # audio mode; Linux also needs PortAudio (libportaudio2)
]

[project.urls]
Homepage = "https://github.com/wolfybird/shaperunner"
Issues = "https://github.com/wolfybird/shaperunner/issues"

[project.scripts]
shaperunner = "shaperunner:main"

[tool.hatch.version]
path = "shapes_v10-3.py"                                    # CURRENT
pattern = 'APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"shapes_v10-3.py" = "shaperunner.py"                        # CURRENT

[tool.hatch.build.targets.sdist]
include = ["/shapes_v10-3.py", "/README.md", "/LICENSE", "/pyproject.toml"]   # CURRENT
